<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body style="margin:0; padding:20px; background:var(--surface-page);">
<div id="root"></div>
<script type="text/babel">
const { Tabs, Modal, Accordion } = window.AdoptaUnOlvidadoDesignSystem_167478;
function Demo() {
  const [mode, setMode] = React.useState('Mensual');
  const [open, setOpen] = React.useState(false);
  React.useEffect(() => { window.lucide && window.lucide.createIcons(); });
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 18 }}>
      <div style={{ display: 'flex', gap: 16, alignItems: 'center' }}>
        <Tabs options={['Dona una vez', 'Mensual']} value={mode} onChange={setMode} />
        <button onClick={() => setOpen(true)} style={{ padding: '10px 18px', borderRadius: 999, border: '1.5px solid var(--border-brand)', background: 'transparent', cursor: 'pointer', fontFamily: 'var(--font-body)' }}>Abrir modal</button>
      </div>
      <Accordion items={[
        { q: '¿Cómo adoptar?', a: 'Completa nuestro formulario de adopción y agenda una videollamada con nuestro equipo.' },
        { q: '¿Cómo apadrinar?', a: 'Elige un aporte mensual automático o voluntario y acompaña el proceso de tu ahijado.' },
      ]} />
      <Modal open={open} onClose={() => setOpen(false)} title="Elige una cantidad para donar">
        <p style={{ font: 'var(--font-body-base)', color: 'var(--text-secondary)' }}>Modo: {mode}</p>
      </Modal>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
