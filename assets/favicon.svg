<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Adopta un Olvidado">
  <!-- Fondo azul de la marca. Una patita amarilla sola desaparecería sobre la
       barra clara del navegador; el cuadro le da contraste en claro y oscuro. -->
  <rect width="64" height="64" rx="14" fill="#021C4B"/>
  <!-- Formas gruesas a propósito: a 16 píxeles el detalle fino se vuelve mancha. -->
  <g fill="#FEBC1A">
    <ellipse cx="16.8" cy="24.3" rx="6.9" ry="8.7" transform="rotate(-22 16.8 24.3)"/>
    <ellipse cx="27.6" cy="18.0" rx="6.9" ry="9.0" transform="rotate(-6 27.6 18.0)"/>
    <ellipse cx="39.4" cy="19.8" rx="6.9" ry="9.0" transform="rotate(12 39.4 19.8)"/>
    <ellipse cx="47.5" cy="30.6" rx="6.3" ry="8.1" transform="rotate(32 47.5 30.6)"/>
    <ellipse cx="30.3" cy="42.4" rx="15.3" ry="12.6"/>
  </g>
</svg>
