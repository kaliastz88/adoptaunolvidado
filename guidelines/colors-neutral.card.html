<!-- @dsCard group="Colors" viewport="700x220" name="Neutrals" subtitle="Warm grays — never pure black/gray" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:grid; grid-template-columns:repeat(6,1fr); height:100%; font-family:var(--font-body); font-size:11px;">
  <div style="background:var(--neutral-0); border:1px solid #eee; display:flex;align-items:flex-end;padding:6px">0</div>
  <div style="background:var(--neutral-25); display:flex;align-items:flex-end;padding:6px">25</div>
  <div style="background:var(--neutral-50); display:flex;align-items:flex-end;padding:6px">50</div>
  <div style="background:var(--neutral-100); display:flex;align-items:flex-end;padding:6px">100</div>
  <div style="background:var(--neutral-200); display:flex;align-items:flex-end;padding:6px">200</div>
  <div style="background:var(--neutral-300); display:flex;align-items:flex-end;padding:6px">300</div>
  <div style="background:var(--neutral-400); display:flex;align-items:flex-end;padding:6px; color:#fff">400</div>
  <div style="background:var(--neutral-500); display:flex;align-items:flex-end;padding:6px; color:#fff">500</div>
  <div style="background:var(--neutral-600); display:flex;align-items:flex-end;padding:6px; color:#fff">600</div>
  <div style="background:var(--neutral-700); display:flex;align-items:flex-end;padding:6px; color:#fff">700</div>
  <div style="background:var(--neutral-800); display:flex;align-items:flex-end;padding:6px; color:#fff">800</div>
  <div style="background:var(--neutral-900); display:flex;align-items:flex-end;padding:6px; color:#fff">900</div>
</div>
